<!doctype html>
<html lang="pl" class="no-js">
<head>
  <!--#include head-->
  <link rel="stylesheet" href="/assets/css/app.css?v={{V}}">
  <script src="/assets/js/theme.js?v={{V}}"></script>
</head>
<body class="{{BODY_CLASS}}">
  <a class="skip-link" href="#view">Przejdź do treści</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Nawigacja panelu">
      <a class="brand" href="/panel" data-link><img class="brand-logo" src="/assets/img/logo.svg" alt="" width="34" height="34">modulio<span class="brand-dot">.</span></a>

      <nav aria-label="Panel klienta">
        <a class="side-link" href="/panel" data-link data-nav="pulpit"><i data-lucide="layout-dashboard"></i> Pulpit</a>
        <a class="side-link" href="/panel/projekty" data-link data-nav="projekty"><i data-lucide="folder-kanban"></i> Projekty</a>
        <a class="side-link" href="/panel/zgloszenia" data-link data-nav="zgloszenia"><i data-lucide="life-buoy"></i> Zgłoszenia <span class="side-badge" data-badge="tickets" hidden></span></a>
        <a class="side-link" href="/panel/faktury" data-link data-nav="faktury"><i data-lucide="receipt"></i> Faktury <span class="side-badge" data-badge="invoices" hidden></span></a>
        <a class="side-link" href="/panel/dokumenty" data-link data-nav="dokumenty"><i data-lucide="folder-open"></i> Dokumenty</a>
        <div class="side-label">Konto</div>
        <a class="side-link" href="/panel/konto" data-link data-nav="konto"><i data-lucide="user-cog"></i> Ustawienia</a>
        <a class="side-link" href="/"><i data-lucide="globe"></i> Strona Modulio</a>
      </nav>

      <div class="side-help">
        <b>Potrzebujesz pomocy?</b>
        <p>Opisz problem lub zmianę — opiekun odpowie w wątku.</p>
        <button type="button" class="button button-dark" data-new-ticket><i data-lucide="plus"></i> Nowe zgłoszenie</button>
      </div>

      <div class="side-user">
        <span class="avatar" data-user-initials>—</span>
        <div><b data-user-name>…</b><small data-user-email></small></div>
        <button type="button" class="icon-btn" data-logout aria-label="Wyloguj się" title="Wyloguj się"><i data-lucide="log-out"></i></button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-main">
      <header class="topbar" id="topbar">
        <button type="button" class="icon-btn bordered menu-btn" id="menu-btn" aria-label="Otwórz menu" aria-controls="sidebar" aria-expanded="false"><i data-lucide="menu"></i></button>
        <div class="topbar-title">
          <div class="crumbs" id="crumbs"></div>
          <h1 id="page-title">Panel klienta</h1>
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-btn bordered" id="theme-btn" aria-label="Przełącz motyw" title="Przełącz motyw"><i data-lucide="moon"></i></button>
          <button type="button" class="button button-coral btn-sm hide-sm" data-new-ticket><i data-lucide="plus"></i> Nowe zgłoszenie</button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
    </div>

    <nav class="tabbar" aria-label="Szybka nawigacja">
      <a href="/panel" data-link data-nav="pulpit"><i data-lucide="layout-dashboard"></i> Pulpit</a>
      <a href="/panel/projekty" data-link data-nav="projekty"><i data-lucide="folder-kanban"></i> Projekty</a>
      <a href="/panel/zgloszenia" data-link data-nav="zgloszenia"><i data-lucide="life-buoy"></i> Zgłoszenia<span class="dot" data-dot="tickets" hidden></span></a>
      <a href="/panel/faktury" data-link data-nav="faktury"><i data-lucide="receipt"></i> Faktury<span class="dot" data-dot="invoices" hidden></span></a>
      <a href="/panel/dokumenty" data-link data-nav="dokumenty"><i data-lucide="folder-open"></i> Pliki</a>
    </nav>
  </div>

  <div class="toast-host" id="toast-host" aria-live="polite"></div>
  <script src="/assets/js/panel.js?v={{V}}" defer></script>
</body>
</html>
